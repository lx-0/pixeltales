name: ci

on:
  push:
    branches: [main, origin]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint + typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python + sync deps
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run --no-sync ruff check

      - name: Ruff format check
        run: uv run --no-sync ruff format --check

      - name: Mypy
        run: uv run --no-sync mypy app

      - name: Pytest (with coverage)
        run: uv run pytest --cov --cov-report=xml --cov-report=term

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: frontend (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (vitest, with coverage)
        run: pnpm test:coverage

      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build
        run: pnpm build

  e2e:
    name: e2e (playwright smoke)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Backend setup
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Backend deps
        working-directory: backend
        run: uv sync --frozen

      - name: Backend DB migrate
        working-directory: backend
        run: |
          mkdir -p data/sqlite data/characters
          uv run alembic upgrade head

      - name: Start backend (background)
        working-directory: backend
        run: |
          uv run uvicorn app.main:socket_app --host 127.0.0.1 --port 8000 \
            > backend.log 2>&1 &
          echo $! > backend.pid
        env:
          # Smoke test only checks the page loads + socket connects;
          # no real LLM calls happen, so a placeholder key is fine.
          OPENAI_API_KEY: sk-ci-placeholder
          BACKEND_CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
          CHARACTERS_DATA_DIR: data/characters

      - name: Wait for backend health
        run: |
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "backend ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "backend failed to come up — last 50 lines of log:"
          tail -50 backend/backend.log || true
          exit 1

      # Frontend setup
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}

      - name: Install Playwright (chromium)
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Start frontend preview (background)
        working-directory: frontend
        run: |
          pnpm preview --host 127.0.0.1 --port 5173 > frontend.log 2>&1 &
          echo $! > frontend.pid
        env:
          VITE_BACKEND_URL: http://127.0.0.1:8000

      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:5173 > /dev/null; then
              echo "frontend ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "frontend failed to come up — last 50 lines of log:"
          tail -50 frontend/frontend.log || true
          exit 1

      - name: Run Playwright smoke
        working-directory: frontend
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down backend + frontend
        if: always()
        run: |
          [ -f backend/backend.pid ] && kill "$(cat backend/backend.pid)" || true
          [ -f frontend/frontend.pid ] && kill "$(cat frontend/frontend.pid)" || true
