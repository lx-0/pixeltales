[project]
name = "pixeltales-backend"
version = "0.1.0"
description = "PixelTales Backend - Where AI Characters Tell Their Stories"
authors = [{ name = "Alex" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.118,<0.120",
  "uvicorn[standard]>=0.34,<1",
  "langchain>=0.3,<0.4",
  "langchain-core>=0.3,<0.4",
  "langchain-community>=0.3,<0.4",
  "langchain-openai>=0.2,<0.4",
  "langchain-anthropic>=0.3.1,<0.4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.6,<3",
  "python-socketio>=5.12,<6",
  "sqlalchemy>=2.0.36,<3",
  "alembic>=1.14,<2",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.30,<1",
  "greenlet>=3.0,<4",
  "python-multipart>=0.0.20,<1",
  "structlog>=25,<26",
  "slowapi>=0.1.9,<1",
  "prometheus-fastapi-instrumentator>=7.0,<8",
  "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "ruff>=0.8,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "httpx>=0.28,<1",
  "types-aiofiles>=24.1",
  "types-python-dateutil>=2.9",
  "types-pyyaml>=6.0",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
strict_optional = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "dist"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
]
ignore = [
  "E501",  # line-too-long — handled by formatter
  "B008",  # do not perform function call in argument defaults — common with FastAPI Depends
]

[tool.ruff.lint.per-file-ignores]
"app/services/scene_manager.py" = ["RUF006"]  # fix in Phase 3b LangGraph rewrite

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -q --strict-markers --strict-config"
filterwarnings = [
  "ignore::DeprecationWarning:passlib.*",
]
