[tool.poetry]
name = "pixeltales-backend"
version = "0.1.0"
description = "PixelTales Backend - Where AI Characters Tell Their Stories"
authors = ["Alex"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.6"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
langchain = "^0.3.0"
langchain-core = ">=0.3,<0.4"
langchain-community = ">=0.3,<0.4"
langchain-openai = ">=0.2,<0.3"
langchain-anthropic = "^0.3.1"
pydantic = "^2.10.4"
pydantic-settings = "^2.1.0"
python-socketio = "^5.12.1"
sqlalchemy = "^2.0.36"
aiosqlite = "^0.20.0"
asyncpg = "^0.29.0"
greenlet = "^3.0.3"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.20"

[tool.poetry.group.dev.dependencies]
mypy = "^1.14.1"
ruff = "^0.8.0"
types-aiofiles = "^24.1.0.20241221"
types-python-dateutil = "^2.9.0.20241206"

[tool.mypy]
plugins = ["pydantic.mypy"]
strict_optional = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "dist"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
]
ignore = [
  "E501",  # line-too-long — handled by formatter
  "B008",  # do not perform function call in argument defaults — common with FastAPI Depends
]

[tool.ruff.lint.per-file-ignores]
"app/db/init_db.py" = ["F401"]  # imports for SQLAlchemy metadata registration
"app/services/scene_manager.py" = ["RUF006"]  # fix in Phase 3 LangGraph rewrite

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
